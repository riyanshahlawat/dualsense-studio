name: Report a bug
description: Report a reproducible problem in the application.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the project.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.0.1
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Windows x64
        - Windows x86
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual results.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. I connected the DualSense...
        2. I started audio...
        3. The problem occurred...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste only relevant logs and remove personal information.
      render: shell
